<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sembakonya Fiqih</title>

<style>

body{
font-family:Arial;
background:#0f2027;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#ffffff10;
padding:15px;
border-radius:15px;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
background:#ffffff20;
}

.icon{
font-size:40px;
margin-bottom:10px;
}

.name{
font-size:18px;
font-weight:bold;
}

.price{
margin-top:10px;
font-size:20px;
color:#25D366;
font-weight:bold;
}

.btn{
display:inline-block;
margin-top:15px;
background:#25D366;
color:white;
text-decoration:none;
padding:10px 15px;
border-radius:20px;
font-size:14px;
}
  
a{
display:inline-block;
margin-top:20px;
color:white;
text-decoration:none;
background:#25D366;
padding:10px 20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<h1>🛒 Sembakonya Fiqih</h1>

<div class="products">

<div class="card">
<div class="icon">🌾</div>
<div class="name">Beras Pulen Premium (Top Anak Raja, Anak Raja Pulen Wangi, Cantik Manis Setra Ramos)</div>
<div>5 Kg</div>
<div class="price">Rp75.000</div>

<a class="btn"
href="https://wa.me/6289654082548?text=Halo%20Fiqih%2C%20saya%20mau%20pesan%20Beras%20Pulen%20Premium">
Order
</a>
</div>

<div class="card">
<div class="icon">🌴</div>
<div class="name">Minyak Goreng Kemasan (Sunco, Sania, Tropical)</div>
<div>1 dan 2 Liter</div>
<div class="price">Rp20.250</div>

<a class="btn"
href="https://wa.me/6289654082548?text=Halo%20Fiqih%2C%20saya%20mau%20pesan%20Minyak%20Goreng">
Order
</a>
</div>

<div class="card">
<div class="icon">🧂</div>
<div class="name">Gula Pasir Premium (Gulaku, PSM, Rose Brand)</div>
<div>1 Kg</div>
<div class="price">Rp17.000</div>

<a class="btn"
href="https://wa.me/6289654082548?text=Halo%20Fiqih%2C%20saya%20mau%20pesan%20Gula%20Pasir">
Order
</a>
</div>

</div>
  
<a href="index.html">Kembali ke Halaman Utama</a>

</body>
</html>
